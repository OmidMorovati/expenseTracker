{{define "dashboard"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Automatically attach JWT to all HTMX requests
        document.body.addEventListener('htmx:configRequest', (e) => {
            const token = localStorage.getItem('auth_token');
            if (token) e.detail.headers['Authorization'] = 'Bearer ' + token;
        });
        // Redirect to login on 401
        document.body.addEventListener('htmx:responseError', (e) => {
            if (e.detail.xhr.status === 401) window.location.href = '/login';
        });
    </script>
</head>
<body>
<nav>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/expenses/new">➕ Add Expense</a>
    <button onclick="localStorage.removeItem('auth_token'); window.location.href='/login'" style="margin-left:auto">🚪 Logout</button>
</nav>
<main>
    <div class="container">
        <h1>Expense Dashboard</h1>
        <div class="stats">
            <div class="card"><h3>Today's Total</h3><p id="today-total">$0.00</p></div>
            <div class="card"><h3>This Month</h3><p id="month-total">$0.00</p></div>
        </div>
        <!-- 👇 Filter Tabs -->
        <div style="display:flex; gap:0.5rem; margin: 1.5rem 0;">
            <button hx-get="/api/expenses/stats?period=today" hx-target="#stats-container" hx-swap="innerHTML" class="btn-secondary">Today</button>
            <button hx-get="/api/expenses/stats?period=week" hx-target="#stats-container" hx-swap="innerHTML" class="btn-secondary">This Week</button>
            <button hx-get="/api/expenses/stats?period=month" hx-target="#stats-container" hx-swap="innerHTML" class="btn-secondary">This Month</button>
        </div>
        <!-- 👇 This is the target container that HTMX will update -->
        <div id="stats-container" class="stats" hx-get="/api/expenses/stats?period=today" hx-trigger="load" hx-swap="innerHTML">
            <div class="card"><h3>Loading...</h3></div>
        </div>
        <!-- FILTER BUTTONS -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
            <button hx-get="/expenses/recent?limit=5" hx-target="#recent-list" hx-swap="innerHTML" class="btn-secondary">Last 5</button>
            <button hx-get="/expenses/recent?limit=10" hx-target="#recent-list" hx-swap="innerHTML" class="btn-secondary">Last 10</button>
            <button hx-get="/expenses/recent?limit=50" hx-target="#recent-list" hx-swap="innerHTML" class="btn-secondary">Show 50</button>
        </div>
        <h2>Recent Expenses</h2>
        <table>
            <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th></tr></thead>
            <tbody id="recent-list"
                   hx-get="/expenses/recent?limit=10"
                   hx-trigger="load"
                   hx-swap="innerHTML">
            <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
{{end}}
