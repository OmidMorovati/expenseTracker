{{define "create"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        document.body.addEventListener('htmx:configRequest', (e) => {
            const token = localStorage.getItem('auth_token');
            if (token) e.detail.headers['Authorization'] = 'Bearer ' + token;
        });
        document.body.addEventListener('htmx:responseError', (e) => {
            if (e.detail.xhr.status === 401) window.location.href = '/login';
        });
    </script>
</head>
<body>
<nav>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/expenses/new">➕ Add Expense</a>
    <button onclick="localStorage.removeItem('auth_token'); window.location.href='/login'" style="margin-left:auto">🚪 Logout</button>
</nav>
<main>
    <div class="container">
        <h1>Add New Expense</h1>
        <form id="expense-form" hx-post="/expenses" hx-target="#form-response" hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) this.reset()">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required placeholder="e.g., Grocery shopping">
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="food">Food & Dining</option>
                    <option value="transport">Transport</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="bills">Bills & Utilities</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <button type="submit">Submit Expense</button>
        </form>
        <div id="form-response"></div>
    </div>
</main>
<script>document.getElementById('date').valueAsDate = new Date();</script>
</body>
</html>
{{end}}
